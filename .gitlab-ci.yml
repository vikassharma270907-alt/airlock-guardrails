stages:
  - build
  - test
  - gate
  - staging
  - verify
  - report
  - production

include:
  - template: Security/SAST.gitlab-ci.yml
  - template: Security/Secret-Detection.gitlab-ci.yml

variables:
  SAST_EXCLUDED_PATHS: "spec, test, tests, tmp, demo"
  AST_ENABLE_MR_PIPELINES: 'true'
  SECRET_DETECTION_ENABLED: 'true'

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS
      when: never
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

default:
  image: python:3.12

.ledger:
  after_script:
    - python tools/ledger.py $CI_JOB_NAME $CI_JOB_STATUS
  artifacts:
    when: always
    paths:
      - ledger/

build-wheel:
  stage: build
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - pip install build
    - python -m build --wheel
  artifacts:
    paths:
      - dist/

unit-tests:
  extends: .ledger
  stage: test
  script:
    - pip install -r requirements-dev.txt
    - pytest -q

# Ensure semgrep-sast runs on MRs as well
semgrep-sast:
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

policy-gate:
  extends: .ledger
  stage: gate
  variables:
    GIT_DEPTH: '0'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - mkdir -p .trusted_tools
    - 'git show "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}:tools/policy_gate.py" > .trusted_tools/policy_gate.py || cp tools/policy_gate.py .trusted_tools/policy_gate.py'
    - 'git show "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}:policy/policy.json" > .trusted_tools/policy.json || cp policy/policy.json .trusted_tools/policy.json'
    - python .trusted_tools/policy_gate.py

sast-gate:
  extends: .ledger
  stage: gate
  variables:
    GIT_DEPTH: '0'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - mkdir -p .trusted_tools
    - 'git show "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}:tools/sast_gate.py" > .trusted_tools/sast_gate.py || cp tools/sast_gate.py .trusted_tools/sast_gate.py'
    - 'git show "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}:policy/policy.json" > .trusted_tools/policy.json || cp policy/policy.json .trusted_tools/policy.json'
    - python .trusted_tools/sast_gate.py

fix-budget:
  extends: .ledger
  stage: gate
  variables:
    GIT_DEPTH: '0'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - mkdir -p .trusted_tools
    - 'git show "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}:tools/fix_budget.py" > .trusted_tools/fix_budget.py || cp tools/fix_budget.py .trusted_tools/fix_budget.py'
    - 'git show "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}:policy/policy.json" > .trusted_tools/policy.json || cp policy/policy.json .trusted_tools/policy.json'
    - python .trusted_tools/fix_budget.py

regression-gate:
  extends: .ledger
  stage: gate
  variables:
    GIT_DEPTH: '0'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
  script:
    - mkdir -p .trusted_tools
    - 'git show "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}:tools/regression_gate.py" > .trusted_tools/regression_gate.py || cp tools/regression_gate.py .trusted_tools/regression_gate.py'
    - 'git show "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}:policy/incidents.json" > .trusted_tools/incidents.json || cp policy/incidents.json .trusted_tools/incidents.json'
    - python .trusted_tools/regression_gate.py
  artifacts:
    when: always
    paths:
      - artifacts/

state-guard:
  extends: .ledger
  stage: gate
  variables:
    GIT_DEPTH: '0'
  rules:
    - if: $CI_PIPELINE_SOURCE == 'merge_request_event'
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - mkdir -p .trusted_tools
    - 'git show "origin/${CI_MERGE_REQUEST_TARGET_BRANCH_NAME:-main}:tools/state_guard.py" > .trusted_tools/state_guard.py || cp tools/state_guard.py .trusted_tools/state_guard.py'
    - python .trusted_tools/state_guard.py --self-test


publish-staging:
  stage: staging
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  environment: staging
  script:
    - 'W=$(ls dist/*.whl | head -n1)'
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$W" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/airlock-demo/0.1.$CI_PIPELINE_IID/$(basename $W)"'

smoke-test:
  extends: .ledger
  stage: verify
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" -o airlock_demo-0.1.0-py3-none-any.whl "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/airlock-demo/0.1.$CI_PIPELINE_IID/airlock_demo-0.1.0-py3-none-any.whl"'
    - 'pip install airlock_demo-0.1.0-py3-none-any.whl'
    - 'python -m airlock_demo --help'

scorecard:
  stage: report
  when: always
  script:
    - python tools/scorecard.py
  artifacts:
    when: always
    paths:
      - scorecard.md

publish-production:
  stage: production
  rules:
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
      when: manual
  environment: production
  script:
    - 'W=$(ls dist/*.whl | head -n1)'
    - 'curl --fail --header "JOB-TOKEN: $CI_JOB_TOKEN" --upload-file "$W" "$CI_API_V4_URL/projects/$CI_PROJECT_ID/packages/generic/airlock-demo-release/1.0.$CI_PIPELINE_IID/$(basename $W)"'

